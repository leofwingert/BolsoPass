# Infraestrutura local completa do BolsoPass: `docker compose up --build` (RF-17, RNF-08).
#
#   Frontend ............ http://localhost:3000
#   Frontend HTTPS ...... https://<IP do PC>:3443  (celular; aceite o aviso do certificado)
#   API ................. http://localhost:8080
#   AKHQ (UI do Kafka) .. http://localhost:8089
#   Mailpit (e-mails) ... http://localhost:8025
#   Kafka (do host) ..... localhost:9092 · PostgreSQL localhost:5433 · Redis localhost:6379
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolsopass
      POSTGRES_USER: bolsopass
      POSTGRES_PASSWORD: bolsopass
    ports:
      # 5433 no host: não briga com um PostgreSQL instalado na máquina (POSTGRES_HOST_PORT muda).
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsopass"]
      interval: 5s
      retries: 10

  # Kafka 3.8 em modo KRaft (sem Zookeeper), 1 broker em dev (doc 03 do Pacote 2).
  # Dois listeners: "kafka:9092" para os contêineres e "localhost:9092" para quem roda no host.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são criados pela aplicação, com as partições do doc 03.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # UI de mensageria exigida pelo enunciado: tópicos, mensagens e grupos de consumo.
  akhq:
    image: tchiotludo/akhq:0.25.1
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            bolsopass:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"

  # Travas de assento, refresh tokens e cache do catálogo (versão 5.0, passos 5 a 7).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Caixa de e-mail falsa para ver os comprovantes (versão 5.0, passo 3).
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/bolsopass
      DB_USER: bolsopass
      DB_PASSWORD: bolsopass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Confia no X-Forwarded-Proto/Port do nginx: com HTTPS (3443) o backend vê a mesma origem
      # da página e não recusa o login como "Invalid CORS request".
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Check-in por reconhecimento facial (AWS Rekognition). Sem credenciais AWS, roda o simulado.
  # Para o real: FACIAL_REKOGNITION_MODE=aws AWS_REGION=... AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
  facial-checkin:
    build:
      context: services/facial-checkin-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/bolsopass
      DB_USER: bolsopass
      DB_PASSWORD: bolsopass
      FACIAL_JWKS_URI: http://backend:8080/api/v1/auth/jwks
      FACIAL_TICKETING_URL: http://backend:8080/api/v1
      FACIAL_REKOGNITION_MODE: ${FACIAL_REKOGNITION_MODE:-simulated}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8090:8090"

  frontend:
    build:
      context: .
      dockerfile: apps/web-spa/Dockerfile
    environment:
      # IP do PC na rede (opcional): entra no certificado HTTPS de desenvolvimento.
      HOST_IP: ${HOST_IP:-}
    depends_on:
      - backend
      - facial-checkin
    ports:
      - "3000:3000"
      # HTTPS para o celular: a câmera do leitor de QR só abre em HTTPS fora do localhost.
      - "3443:3443"
    volumes:
      - certs:/etc/nginx/certs

volumes:
  pgdata:
  kafkadata:
  certs:

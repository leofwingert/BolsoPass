# Infraestrutura local completa do BolsoPass.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolsopass
      POSTGRES_USER: bolsopass
      POSTGRES_PASSWORD: bolsopass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsopass"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/bolsopass
      DB_USER: bolsopass
      DB_PASSWORD: bolsopass
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: apps/web-spa/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:

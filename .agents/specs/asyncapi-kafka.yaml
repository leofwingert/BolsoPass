asyncapi: 2.6.0
info:
  title: BolsoPass - Especificação de Eventos Kafka
  version: 1.0.0
  description: Esquemas e tópicos de mensageria assíncrona do Apache Kafka na plataforma BolsoPass.
channels:
  reservas.expiradas:
    description: Publicado quando o TTL de 10 minutos de uma reserva expira sem confirmação de pagamento.
    publish:
      message:
        name: ReservaExpiradaEvent
        payload:
          type: object
          required:
            - event_id
            - seat_id
            - reservation_id
            - expired_at
          properties:
            event_id:
              type: string
              format: uuid
            seat_id:
              type: string
            reservation_id:
              type: string
              format: uuid
            expired_at:
              type: string
              format: date-time

  pedidos.pagos:
    description: Publicado via Transactional Outbox após confirmação ACID do pagamento no PostgreSQL.
    publish:
      message:
        name: PedidoPagoEvent
        payload:
          type: object
          required:
            - order_id
            - client_id
            - event_id
            - seat_id
            - amount_cents
            - paid_at
          properties:
            order_id:
              type: string
              format: uuid
            client_id:
              type: string
              format: uuid
            event_id:
              type: string
              format: uuid
            seat_id:
              type: string
            amount_cents:
              type: integer
            paid_at:
              type: string
              format: date-time

  checkin.realizado:
    description: >
      Publicado via Transactional Outbox quando a portaria libera a entrada, na mesma transação que
      marca o ingresso como utilizado. Mesmo contrato para o QR Code e o reconhecimento facial
      (campo metodo). Chave de particionamento: ticketId.
    publish:
      message:
        name: CheckinRealizadoEvent
        payload:
          type: object
          required:
            - ticketId
            - eventId
            - metodo
            - timestamp
            - operadorId
          properties:
            ticketId:
              type: string
              example: TK-55492-A02
            eventId:
              type: string
              example: evt-neon
            metodo:
              type: string
              enum: [QR, FACIAL]
            timestamp:
              type: string
              format: date-time
              description: Momento da entrada (no QR offline, o horário da leitura no aparelho).
            operadorId:
              type: string
              description: Id do usuário da bilheteria que fez a leitura.
            portao:
              type: string
              example: Portão 01

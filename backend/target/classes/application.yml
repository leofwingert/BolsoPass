spring:
  application:
    name: bolsopass-api
  profiles:
    # dev = H2 em memória (roda sem Docker). Use "postgres" com o docker-compose.
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

bolsopass:
  reservation-ttl: 10m
  service-fee-rate: 0.10
  jwt:
    access-ttl: 15m
    refresh-ttl: 7d
  cors-origins: http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:bolsopass;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bolsopass}
    username: ${DB_USER:bolsopass}
    password: ${DB_PASSWORD:bolsopass}
  jpa:
    hibernate:
      # TODO: trocar por migrações Flyway antes de produção.
      ddl-auto: update

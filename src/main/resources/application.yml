spring:
  application:
    name: bolsopass-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bolsopass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bolsopass-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

bolsopass:
  reservation:
    ttl-seconds: 600
  idempotency:
    ttl-hours: 24
  jwt:
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 7


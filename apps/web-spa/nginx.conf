# HTTP na 3000 (uso no próprio PC) e HTTPS na 3443 (celular pela rede: o navegador só libera a
# câmera do leitor de QR em HTTPS ou em localhost). O certificado é de desenvolvimento, gerado por
# docker/10-gen-cert.sh na primeira subida.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/bolsopass-locations.conf;
}

server {
    listen 3443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/bolsopass.crt;
    ssl_certificate_key /etc/nginx/certs/bolsopass.key;

    include /etc/nginx/bolsopass-locations.conf;
}

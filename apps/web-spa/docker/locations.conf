# Rotas comuns ao HTTP (3000) e ao HTTPS (3443). Incluído pelos dois blocos "server" do nginx.conf.

# Check-in por reconhecimento facial: microssistema próprio (fotos até 5 MB).
location /api/v1/facial/ {
    proxy_pass http://facial-checkin:8090;
    proxy_http_version 1.1;
    client_max_body_size 6m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}

location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    # Host com a porta + protocolo e porta originais: o backend vê a mesma origem da página
    # (senão recusa o login com "Invalid CORS request" ao acessar pelo IP ou por HTTPS).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}

# Sem barra no fim: o app conecta em "/ws" (com barra, o WebSocket caía no index.html).
location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}

location / {
    try_files $uri $uri/ /index.html;
}
